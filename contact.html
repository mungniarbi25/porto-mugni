<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — R.MugniPorto</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="logo">👨‍💻 R.Mugni<span>Porto</span></div>
    <nav class="nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="statistika.html">Project Statistika</a></li>
        <li><a href="project.html">My Adventure</a></li>
        <li><a href="skills.html">Skills</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <div class="page-shell">
    <section class="contact" id="contact" data-aos="fade-up">
      <h2 class="section-title">Contact Me</h2>
      <p class="contact-subtext">Silakan hubungi saya jika tertarik kerjasama 🙏</p>

      <form action="https://formspree.io/f/mpwrvkrq" method="POST" class="contact-form">
        <input type="text" name="name" placeholder="Nama Anda" required>
        <input type="email" name="email" placeholder="Email Anda" required>
        <textarea name="message" rows="5" placeholder="Pesan Anda" required></textarea>
        <button type="submit">Kirim Pesan</button>
      </form>

      <div class="contact-info">
        <p><i class="fas fa-envelope"></i> charbiasyari25@gmail.com</p>
        <p><i class="fab fa-whatsapp"></i> +62 857-7946-3668</p>
        <p><i class="fab fa-linkedin"></i> linkedin.com/in/r-mugni-chairil-arbi</p>
      </div>
    </section>
  </div>

  <footer class="footer">
    <p>&copy; 2026 R. Mugni Chairil Arbi. All rights reserved.</p>
  </footer>

  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ once: true, duration: 700 });

    const form = document.querySelector(".contact-form");
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const response = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { Accept: "application/json" }
      });
      if (response.ok) {
        alert("✅ Pesan berhasil dikirim!");
        form.reset();
      } else {
        alert("❌ Gagal mengirim pesan. Silakan coba lagi.");
      }
    });
  </script>
</body>
</html>
